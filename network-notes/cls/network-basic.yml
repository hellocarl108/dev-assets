rule-providers:

  javdb-domain:
    url: https://cdn.jsdelivr.net/gh/hellocarl108/dev-assets@main/network-notes/cls/rules/javdb-domain.yml
    path: ./ruleset/javdb-domain.yml
    behavior: domain
    interval: 86400
    format: yaml
    type: http

  dmm-domain:
    url: https://cdn.jsdelivr.net/gh/hellocarl108/dev-assets@main/network-notes/cls/rules/dmm-domain.yml
    path: ./ruleset/dmm-domain.yml
    behavior: domain
    interval: 86400
    format: yaml
    type: http

  dmm-ipcidr:
    url: https://cdn.jsdelivr.net/gh/hellocarl108/dev-assets@main/network-notes/cls/rules/dmm-ipcidr.yml
    path: ./ruleset/dmm-ipcidr.yml
    behavior: ipcidr
    interval: 86400
    format: yaml
    type: http

# ══════════════════════════════════════════
# 规则 (Rules)
# ══════════════════════════════════════════
rules:
# ================= Google =================
  # 匹配 Google 旗下所有域名（包含 YouTube、Gmail 等）
  - GEOSITE,google,proxy-select
  # 匹配 Google 的 IP 段（no-resolve 防止解析 DNS 导致耗时）
  - GEOIP,google,proxy-select,no-resolve

  # ================= Telegram =================
  # 匹配 Telegram 所有官方域名与 CDN
  - GEOSITE,telegram,proxy-select
  # 匹配 Telegram 客户端使用的固定 IP 段
  - GEOIP,telegram,proxy-select,no-resolve

  # ================= Twitter / X =================
  # 匹配 Twitter / X 旗下所有域名（包含 x.com, twimg.com 等）
  - GEOSITE,twitter,proxy-select
  - GEOIP,twitter,proxy-select,no-resolve

  # ================= GitHub =================
  # 匹配 GitHub 旗下所有域名（包含 github.com, githubassets.com, raw.githubusercontent.com 等）
  - GEOSITE,github,proxy-select

  # ================= OpenAI / ChatGPT =================
  # 匹配 OpenAI / ChatGPT 旗下所有域名（包含 openai.com, chatgpt.com, oaistatic.com 等）
  - GEOSITE,openai,US SELECT

  # ── 中国 IP 直连 ──
  - GEOIP,CN,DIRECT,no-resolve

  # -- dmm --
  - RULE-SET,dmm-domain,JP SELECT
  - RULE-SET,dmm-ipcidr,JP SELECT
  - RULE-SET,javdb-domain,proxy-select

  # ================= 兜底规则（根据实际策略组调整） =================
  #- GEOSITE,geolocation-!cn,proxy-select
  - MATCH,DIRECT

  # -- 一些样例 -- 
  # - 'DOMAIN-SUFFIX,local,🎯 全球直连'
  # - 'IP-CIDR,192.168.0.0/16,🎯 全球直连,no-resolve'
  # - 'IP-CIDR6,fc00::/7,🎯 全球直连,no-resolve'
  # - 'DOMAIN,translate.googleapis.com,🌍 国外媒体'
  # - 'DOMAIN-KEYWORD,tiktok,🌍 国外媒体'
